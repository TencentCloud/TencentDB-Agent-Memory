name: Windows deployment scripts

on:
  pull_request:
    branches: [main, feat/server, feat/server_team]
    paths:
      - 'deploy/global-images/**'
      - '.github/workflows/windows-deploy.yml'
  workflow_dispatch:

jobs:
  deployment:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Test native deployment without Docker or model credentials
        shell: ${{ matrix.shell }}
        run: ./deploy/global-images/tests/windows-deploy.tests.ps1
