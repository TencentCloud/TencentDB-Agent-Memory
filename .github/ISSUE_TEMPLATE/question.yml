name: ❓ Question / Consultation
description: Ask a question about usage or community
title: "[Question] "
labels: ["question"]
assignees: []

body:
  - type: dropdown
    id: question-type
    attributes:
      label: Question Category
      description: Select the category that best describes your question
      options:
        - Usage / How-to
        - Compatibility / Integration
        - Community / Group
        - Other
    validations:
      required: true

  - type: textarea
    id: question-description
    attributes:
      label: Your Question
      description: Describe your question clearly
      placeholder: e.g. Does the memory plugin work with OpenClaw?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context / Background
      description: Any context that helps us understand your question better
      placeholder: e.g. your use case, environment, what you've tried
    validations:
      required: false
