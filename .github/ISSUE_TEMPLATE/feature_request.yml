name: ✨ Feature Request
description: Propose a feature or suggestion
title: "[Feature] "
labels: ["enhancement"]
assignees: []

body:
  - type: textarea
    id: related-problem
    attributes:
      label: Is this feature related to a problem? Please describe
      description: A clear and concise description of the problem
      placeholder: e.g. I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen
      placeholder: Describe the feature you want to add or improve
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions
      placeholder: Optional
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature
      placeholder: Optional
    validations:
      required: false
